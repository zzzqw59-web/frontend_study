<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 페이지</title>
</head>
<body>
    <h1>회원가입</h1>
    <p>
        회원가입에 필요한 정보를 입력해주세요.
    </p>

    <form method="post">
        <fieldset>
            <legend>기본 정보</legend>

            <p>
                <label for="userName">이름</label> <br>
                <input type="text" id="userName" name="userName" placeholder="이름 입력">
            </p>
            <p>
                <label for="userId">아이디</label> <br>
                <input type="text" id="userId" name="userId" placeholder="아이디 입력">
            </p>
            <p>
                <label for="userPw">비밀번호</label> <br>
                <input type="text" id="userId" name="userId" placeholder="비밀번호 입력">
            </p>
            <p>
                <label for="email">이메일</label> <br>
                <input type="email" id="email" name="email" placeholder="example@email.com">
            </p>
        </fieldset>

        <fieldset>
            <legend>추가정보</legend>
            <p>
                성별 <br>
                <input type="radio" name="gender" id="male" value="M">
                <label for="male">남자</label>

                <input type="radio" name="gender" id="female" value="W">
                <label for="female">여자</label>
            </p>

            <p>
                <label for="region">거주지역</label>
                <select name="region" id="region">
                    <option value="">지역선택</option>
                    <option value="seoul">서울</option>
                    <option value="busan">부산</option>
                    <option value="incheon">인천</option>
                    <option value="jeju">제주</option>    
                </select>
            </p>

            <p>
                관심분야 <br>
                <input type="checkbox" id="html" name="interest" value="HTML">
                <label for="html">HTML</label>

                <input type="checkbox" id="css" name="interest" value="CSS">
                <label for="css">CSS</label>

                <input type="checkbox" id="js" name="interest" value="JavaScript">
                <label for="js">JavaScript</label>
            </p>
        </fieldset>

        <p>
            <button type="submit">가입하기</button>
            <button type="reset">다시작성</button>
        </p>
    </form>
</body>
</html>
