<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기 소개 페이지</title>
</head>
<body>
    <h1>자기소개</h1>
    <p>
        안녕하세요. 저는 <strong>김성민</strong> 입니다. <br>
        웹 개발을 배우고 있는 훈련생입니다.
    </p>

    <hr>

    <h2>관심분야</h2>
    <p>
        저는 자바와 데이터 연동 과정에 관심이 많습니다. <br>
        특히 <em>요즘은 컬렉션 프레임워크와 스프링을 활용하여</em>
        사용자가 보기 편한 화면을 만드는 것에 흥미가 있습니다.
    </p>

    <h2>나의 목표</h2>
    <p>
        수업을 통해 간단한 웹 개발의 기본기를 익히고
        간단한 웹 사이트를 직접 만들 수 있는 개발자가 되는 것이 목표입니다.
    </p>

    <h2>나를 표현하는 문장</h2>
    <p>
        천천히 가더라도 포기하지 않고 꾸준히 성장하는 사람이 되고 싶습니다.
    </p>
</body>
</html>
