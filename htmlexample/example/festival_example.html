<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가고 싶은 지역 축제</title>
    <style>
        table {
            width: 800px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }



        td, th {
            border: 1px solid black;
            padding: 20px;
            text-align: center;
        }

        th {
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>지역 축제를 소개합니다.</h1>
    <p>
        유명한 지역 축제에 관해 소개해드릴게요~
    </p>

    <table>
        <caption>유명 행사 지역 축제</caption>
        <thead>
            <tr>
                <th>축제 이름</th>
                <th>장소</th>
                <th>기간</th>
                <th>주요 행사</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>진해 군항제</td>
                <td>경남 창원시 진해구</td>
                <td>3월 말 ~ 4월 초</td>
                <td>로망스다리 불빛 축제</td>
            </tr>
            <tr>
                <td>보령 머드 축제</td>
                <td>보령시 대천 해수욕장</td>
                <td>7월 말 ~ 8월 초</td>
                <td>대형 머드탕</td>
            </tr>
            <tr>
                <td>안동 국제 탈춤 페스티벌</td>
                <td>안동시 원도심</td>
                <td>9월 말 ~ 10월 초</td>
                <td>전통 탈춤 공연</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
