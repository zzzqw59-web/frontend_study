<body>
    <div class="container">
        <h1>세상 모든 엄마들은 위한 <br>가슴 따뜻한 동화</h1>
        <p>하늘에서 하얀 눈이 펑펑 내리고 있다.</p>
        <p>얼룩소가 빨리 나오라는 듯 또 한번 손짓했다.</p>
        <p>셋이 뛰어나가 얼룩소를 에워쌌다.</p>
        <p>랑이가 얼룩소 볼에 자기 볼을 어루만졌다.</p>
        <p>얼룩소도 덩달이 신이나 여기저기 발자국을 남기고 있다.</p>
        <p>꺄르르 웃음소리가 여일당 마당을 가득 채웠다.</p>
        <div class="footer">따뜻한 하루, 사랑을 담아</div>
    </div>
