<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 하루 계획</title>
</head>
<body>
    <h1>나의 하루 계획</h1>
    <p>오늘 하루동안 해야 할 일을 시간대별로 정리한 페이지입니다.</p>

    <hr>

    <div>
        <h2>오전</h2>
        <p>
            <span>09:00</span> 수업 준비하기
            <span>10:00</span> HTML 기본 태그 학습하기 <br>
            <span>11:00</span> 예제 코드 작성하기
        </p>
    </div>
    <hr>

    <div>
        <h2>오후</h2>
        <p>
            <span>13:00</span> 점심식사 후 복습하기 <br>
            <span>14:00</span> 자기소개 페이지 만들기 <br>
            <span>16:00</span> 작성한 코드 실행결과 만들기
        </p>
    </div>
    <hr>

    <div>
        <h2>오늘의 중요 일정</h2>
        <p>
            오늘 가장 중요한 일정은 <mark>HTML 기본 태그 예제 완성하기</mark>입니다.
        </p>
    </div>

    <p>
        작은 계획을 하나씩 실천하면 하루를 더 알차게 보낼 수 있습니다.
    </p>
</body>
</html>
