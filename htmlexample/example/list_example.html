<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 저녁 메뉴</title>
</head>
<body>
    <h1>오늘 저녁 메뉴</h1>
    <p>오늘 저녁에 먹을 메뉴는 <strong>짜글이</strong>입니다.</p>

    <figure>
        <img src="https://recipe1.ezmember.co.kr/cache/recipe/2017/08/24/3f64378110fbc3e79182d38f39dc390b1.jpg" alt="짜글이" width="300">
        <figcaption>맛있는 음식</figcaption>
    </figure>
    <hr>

    <h2>재료</h2>
    <ul>
        <li>고추장</li>
        <li>돼지고기</li>
        <li>감자</li>
    </ul>

    <h2>조리 순서</h2>
    <ol>
        <li>재료 손질하기</li>
        <li>양념장 만들기</li>
        <li>고기와 감자 볶기</li>
        <li>양념 넣고 끓이기</li>
        <li>졸이기</li>
        <li>야채 넣고 마무리</li>
    </ol>

    <h2>용어 설명</h2>
    <dl>
        <dt>짜글이</dt>
        <dd>매콤 칼칼한 돼지고기 감자 짜글이</dd>
    </dl>
</body>
</html>
