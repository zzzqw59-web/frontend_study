<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인라인 스타일</title>
</head>
<body>
    <h1 style="color: #8B5E3C; font-size: 40px;">Reading Quotes(독서 명언)</h1>
    <p style="font-size: 24px; color: #4A3B2A;">책을 가까이 하는 사람은 생각하는 힘을 키우게 합니다.</p>
    <hr>
    
    <blockquote style="font-size: 28px; color: #B8792F; font-weight: bold; font-style: italic;">
        좋은 책은 조용하지만, <br>
        오래도록 마음속에서 말을 건넵니다.
    </blockquote>

    <hr>

    <p style="font-size: 24px; color: #A65F2B; font-weight: bold;">
        오늘의 한 페이지가 내일의 나를 성장시킵니다.
    </p>
</body>
</html>
